# SmartTar v0.2.0 validation workflow
name: SmartTar tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test-only system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xdg-utils gcc
      - name: Verify shell syntax
        run: bash -n install.sh uninstall.sh
      - name: Run unit and integration tests
        run: python3 -m unittest discover -s tests -v

